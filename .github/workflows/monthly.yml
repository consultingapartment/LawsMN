name: Monthly law sync

on:
  schedule:
    # Сар бүрийн 1-ний 02:00 UTC
    - cron: "0 2 1 * *"
  workflow_dispatch:
    inputs:
      categories:
        description: "Ангилал (хоосон = бүгд: 27,28,34,33)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write # үлдэгдэл байвал өөрийгөө дахин эхлүүлэхэд

# Нэг зэрэг хоёр синк ажиллахгүй.
concurrency:
  group: law-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # GitHub-ийн хязгаар 360 минут. Скрипт 300 минутад зогсож, commit хийх хугацаа үлдээнэ.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Sync laws directly to Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          # өөрийн OAuth client ашигласан бол:
          # RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          # RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          if [ -z "$RCLONE_CONFIG_GDRIVE_TOKEN" ]; then
            echo "Алдаа: GDRIVE_TOKEN secret байхгүй байна." >&2
            exit 1
          fi
          ARGS="--time-budget 300 --rclone-root gdrive:LawsMN"
          if [ -n "${{ github.event.inputs.categories }}" ]; then
            ARGS="$ARGS --category ${{ github.event.inputs.categories }}"
          fi
          python sync_laws.py $ARGS

      - name: Remove legacy .doc files
        run: git rm -r -q --ignore-unmatch data/laws

      - name: Commit database
        run: |
          git config user.name "law-sync-bot"
          git config user.email "law-sync-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Өөрчлөлт алга."
          else
            git commit -q -m "sync: $(date -u +%Y-%m-%d) хуулийн сан шинэчлэгдлээ"
            git push
          fi

      - name: Continue backlog if time budget ran out
        # Ахиц гаргасан (шинэ/шинэчилсэн/Drive-д хуулсан > 0) бөгөөд дутуу бол дахин эхлүүлнэ.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PARTIAL=$(jq -r '.partial' data/last_sync.json)
          PROGRESS=$(jq -r '(.new // 0) + (.updated // 0) + (.uploaded // 0)' data/last_sync.json)
          echo "partial=$PARTIAL progress=$PROGRESS"
          if [ "$PARTIAL" = "true" ] && [ "$PROGRESS" -gt 0 ]; then
            gh workflow run monthly.yml --ref "${{ github.ref_name }}" \
              -f categories="${{ github.event.inputs.categories }}"
            echo "Үлдэгдлийг үргэлжлүүлэх ажиллалт эхлүүллээ."
          fi
