name: Sync laws to Google Drive

on:
  workflow_dispatch:
  # Цагаар биш — хуулийн синк амжилттай дуусмагц ажиллана.
  workflow_run:
    workflows: ["Monthly law sync"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: drive-sync
  cancel-in-progress: true

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # Синкийн commit-ийг авахын тулд үндсэн branch-ын хамгийн сүүлийн төлөвийг татна.
          ref: ${{ github.event.repository.default_branch }}

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Sync texts (legal + тогтоол, тушаал)
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          # өөрийн OAuth client ашигласан бол:
          # RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          # RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          if [ -z "$RCLONE_CONFIG_GDRIVE_TOKEN" ]; then
            echo "GDRIVE_TOKEN secret байхгүй"
            exit 1
          fi
          # repo хавтас → Drive хавтас. Хуулийн хавтас (LawsMN) өмнөхөөрөө.
          # Хавтас бүр тусдаа Drive хавтас руу — нэг нь нөгөөгийнхөө файлыг устгахгүй.
          while read -r SRC DEST; do
            if [ ! -d "$SRC" ] || [ -z "$(find "$SRC" -name '*.txt' -print -quit)" ]; then
              echo "$SRC/*.txt алга — алгаслаа"
              continue
            fi
            echo "== $SRC → gdrive:$DEST"
            rclone sync "./$SRC" "gdrive:$DEST" \
              --include "*.txt" \
              --transfers 4 \
              --checkers 8 \
              --drive-chunk-size 16M \
              --stats 1m --stats-one-line
          done <<'MAP'
          legal LawsMN
          uih_togtool LawsMN_UIH_togtool
          said_tushaal LawsMN_Said_tushaal
          zg_togtool LawsMN_ZG_togtool
          MAP
