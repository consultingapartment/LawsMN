name: Sync laws to Google Drive

on:
  workflow_dispatch:
  # Цагаар биш — хуулийн синк амжилттай дуусмагц ажиллана.
  workflow_run:
    workflows: ["Monthly law sync"]
    types: [completed]

permissions:
  contents: read

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          # Синкийн commit-ийг авахын тулд үндсэн branch-ын хамгийн сүүлийн төлөвийг татна.
          ref: ${{ github.event.repository.default_branch }}

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Sync only legal/*.txt
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
          # өөрийн OAuth client ашигласан бол:
          # RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          # RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          if [ -z "$RCLONE_CONFIG_GDRIVE_TOKEN" ]; then
            echo "GDRIVE_TOKEN secret байхгүй"
            exit 1
          fi
          if [ ! -d legal ] || [ -z "$(find legal -name '*.txt' -print -quit)" ]; then
            echo "legal/*.txt алга"
            exit 0
          fi
          rclone sync ./legal gdrive:LawsMN \
            --include "*.txt" \
            --transfers 4 \
            --checkers 8 \
            --drive-chunk-size 16M \
            --verbose
