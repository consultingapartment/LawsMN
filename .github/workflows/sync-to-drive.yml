name: Sync laws to Google Drive

on:
  # Хуулийн сарын sync-ийн дараа автомат (optional: monthly.yml-ээс trigger)
  workflow_run:
    workflows: ["Monthly law sync"]
    types: [completed]
  # Гараар ажиллуулах
  workflow_dispatch:
  # Сар бүрийн 1-ний 04:00 UTC (хуулийн sync 02:00-д ажилладаг гэж үзвэл)
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: read

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    # monthly.yml амжилттай дууссан үед л ажиллуулна (workflow_run-ийн үед)
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Configure rclone (Google Drive)
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          # Хэрэв Shared Drive (Team Drive) ашиглавал:
          # RCLONE_CONFIG_GDRIVE_TEAM_DRIVE: ${{ secrets.GDRIVE_TEAM_DRIVE_ID }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive-sa.json
          EOF
          printf '%s' "$RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS" > /tmp/gdrive-sa.json

      - name: Sync legal/*.txt → Google Drive
        run: |
          if [ ! -d legal ] || [ -z "$(ls -A legal 2>/dev/null)" ]; then
            echo "legal/ хоосон эсвэл байхгүй — sync алгаслаа"
            exit 0
          fi
          # Drive дээрх хавтас: "LawsMN" (өөрчилж болно)
          rclone sync ./legal gdrive:LawsMN \
            --include "*.txt" \
            --create-empty-src-dirs \
            --checksum \
            --transfers 8 \
            --checkers 16 \
            --verbose \
            --stats 30s
          echo "Sync дууслаа."
          rclone lsf gdrive:LawsMN | head -20
          echo "..."
          rclone size gdrive:LawsMN
