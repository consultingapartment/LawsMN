name: Sync laws to Google Drive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: read

jobs:
  sync-drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Sync only legal/*.txt
        env:
          GDRIVE_SA: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GDRIVE_SA" ]; then
            echo "GDRIVE_SERVICE_ACCOUNT_JSON secret байхгүй"
            exit 1
          fi
          if [ ! -d legal ] || [ -z "$(find legal -name '*.txt' -print -quit)" ]; then
            echo "legal/*.txt алга"
            exit 0
          fi
          printf '%s' "$GDRIVE_SA" > /tmp/gdrive-sa.json
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << 'EOF'
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /tmp/gdrive-sa.json
          EOF
          rclone sync ./legal gdrive:LawsMN \
            --include "*.txt" \
            --exclude "*.doc" \
            --exclude "*.docx" \
            --transfers 8 \
            --checkers 16 \
            --verbose
